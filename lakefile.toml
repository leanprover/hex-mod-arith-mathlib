name = "hex-mod-arith-mathlib"
defaultTargets = ["HexModArithMathlib"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexModArith"
git = "https://github.com/leanprover/hex-mod-arith.git"
rev = "e32dbcb49f4e91e6ba357f1235ecb2b0c81e4753"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.2"

[[lean_lib]]
name = "HexModArithMathlib"
